<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabo · Marcador</title>
<meta name="description" content="Marcador sencillo para el juego de cartas Cabo. Funciona sin conexión.">
<meta name="theme-color" content="#f6f2e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cabo">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f766e'/%3E%3Ctext x='32' y='45' font-size='36' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3EC%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f2e8; --card: #ffffff; --text: #1f2328; --muted: #646b75; --line: #ddd6c6;
    --accent: #0f766e; --accent-soft: #d9f0ec; --warn: #b45309; --warn-soft: #fdecc8; --danger: #b42318;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; color-scheme: light;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: max(10px, env(safe-area-inset-top)) 14px 10px; border-bottom: 1px solid var(--line);
  }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: .02em; }
  .lang { border: 1px solid var(--line); background: var(--card); border-radius: 999px; min-height: 36px; padding: 0 14px; font-weight: 600; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #e9e3d4; border-radius: 12px; padding: 4px; }
  .tabs button { border: 0; background: transparent; border-radius: 9px; min-height: 42px; font-weight: 700; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  main { max-width: 560px; margin: 0 auto; padding: 14px 14px calc(28px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  h2 { margin: 0 0 10px; font-size: 1.1rem; }
  .muted { color: var(--muted); }
  .small { font-size: .88rem; }

  .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt b { display: block; }
  .stepper { display: flex; align-items: center; gap: 8px; flex: none; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 1.4rem; font-weight: 700; line-height: 1; }
  .stepper output { min-width: 4.6em; text-align: center; font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .names { display: grid; gap: 8px; }
  .names input, .pts {
    width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px;
  }
  .btn { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 1.05rem; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid currentColor; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .status { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; margin: 2px 2px 10px; }
  .note { background: var(--warn-soft); color: #7a3d05; border-radius: 10px; padding: 9px 12px; margin-bottom: 12px; font-weight: 600; }
  .win { background: var(--accent); color: #fff; border-radius: 14px; padding: 14px; margin-bottom: 14px; text-align: center; }
  .win b { display: block; font-size: 1.35rem; }
  .player { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 10px; padding: 8px 0; }
  .entry { display: flex; align-items: center; gap: 6px; }
  .entry .pts { width: 72px; }
  .neg { width: 38px; height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--muted); font-size: 1.15rem; font-weight: 700; padding: 0; }
  .player + .player { border-top: 1px solid var(--line); }
  .pname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { display: inline-block; font-size: .72rem; font-weight: 700; border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: middle; }
  .tag.lead { background: var(--accent-soft); color: var(--accent); }
  .tag.half { background: var(--warn-soft); color: var(--warn); }
  .total { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; }
  .total.out { color: var(--danger); }
  .pts { text-align: center; font-size: 1.2rem; font-weight: 700; padding: 0 6px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--danger); font-weight: 600; margin: 8px 0 0; }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: .82rem; color: var(--muted); max-width: 6.5em; overflow: hidden; text-overflow: ellipsis; }
  th:first-child, td:first-child { text-align: left; color: var(--muted); }
  tfoot td { font-weight: 800; border-bottom: 0; }
  td small { color: var(--warn); font-weight: 700; }

  #rules h2 { margin-top: 4px; }
  #rules ul, #rules ol { margin: 6px 0 10px; padding-left: 1.25em; }
  #rules li { margin: 4px 0; }
  #rules table td { text-align: left; white-space: normal; }
  #rules table th { text-align: left; white-space: nowrap; max-width: none; font-size: 1rem; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Cabo</h1>
    <button class="lang" id="lang"></button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="score"></button>
    <button role="tab" data-tab="rules"></button>
  </nav>
</header>

<main id="score"></main>
<main id="rules" hidden></main>

<script>
(() => {
  'use strict';
  const KEY = 'cabo-score-v1';
  const MAXP = 8;

  const TXT = {
    es: {
      title: 'Cabo · Marcador', tabScore: 'Marcador', tabRules: 'Reglas', other: 'EN',
      newGame: 'Nueva partida', players: 'Jugadores', rounds: 'Rondas', roundsSub: 'La partida termina al completarlas',
      noLimit: 'Sin límite', points: 'Puntos', pointsSub: 'Pierde quien pase de este número',
      names: 'Nombres', player: 'Jugador', start: 'Empezar',
      round: 'Ronda', of: 'de', limit: 'Límite', addRound: 'Sumar ronda', undo: 'Deshacer ronda',
      fill: 'Escribe los puntos de esta ronda.', history: 'Rondas', total: 'Total',
      lead: 'va ganando', sign: 'cambiar signo', halfTag: '½ usado', out: 'pasó el límite',
      halved: (n, a, b) => `${n} llegó a ${a} exactos: baja a ${b}.`,
      over: 'Fin de la partida', winner: 'Gana', winners: 'Empate', withPts: (p) => `con ${p} puntos`,
      confirmNew: '¿Empezar una partida nueva? Se borrará el marcador actual.',
      halfInfo: (a, b) => `Si alguien queda exactamente en ${a}, baja a ${b} (una vez por jugador).`,
    },
    en: {
      title: 'Cabo · Score', tabScore: 'Score', tabRules: 'Rules', other: 'ES',
      newGame: 'New game', players: 'Players', rounds: 'Rounds', roundsSub: 'The game ends when they are done',
      noLimit: 'No limit', points: 'Points', pointsSub: 'Whoever goes over this number loses',
      names: 'Names', player: 'Player', start: 'Start',
      round: 'Round', of: 'of', limit: 'Limit', addRound: 'Add round', undo: 'Undo round',
      fill: "Enter this round's points.", history: 'Rounds', total: 'Total',
      lead: 'leading', sign: 'change sign', halfTag: '½ used', out: 'over the limit',
      halved: (n, a, b) => `${n} hit exactly ${a}: drops to ${b}.`,
      over: 'Game over', winner: 'Winner', winners: 'Tie', withPts: (p) => `with ${p} points`,
      confirmNew: 'Start a new game? The current score will be erased.',
      halfInfo: (a, b) => `If someone lands exactly on ${a}, they drop to ${b} (once per player).`,
    },
  };

  const RULES = {
    es: `
<div class="card"><h2>Poderes</h2>
<p class="muted small">Solo valen si robas la carta del mazo y la descartas enseguida.</p>
<table>
<tr><th>7 · 8</th><td><b>Peek:</b> mira una de tus cartas.</td></tr>
<tr><th>9 · 10</th><td><b>Spy:</b> mira una carta de otro jugador.</td></tr>
<tr><th>J · Q</th><td><b>Swap:</b> cambia una de tus cartas por la de otro jugador, sin mirarlas.</td></tr>
</table>
<p class="muted small">Valores: Joker = −1, K roja = 0, As (A) = 1; 10, Jota (J), Q y K negra = 10. Las demás cartas no tienen poder.</p></div>
<div class="card"><h2>Objetivo</h2>
<p>Terminar cada ronda con la <b>menor suma</b> de puntos en tus cartas. Al final gana quien tenga menos puntos.</p></div>
<div class="card"><h2>Preparación</h2>
<ul>
<li>Baraja normal con los 2 Jokers (54 cartas). Valores: Joker = −1, K roja = 0, As = 1, del 2 al 9 su número; 10, J, Q y K negra valen 10.</li>
<li>Cada jugador recibe <b>4 cartas boca abajo</b> en fila y mira <b>2</b> de ellas una sola vez.</li>
<li>El resto forma el mazo. Se voltea una carta para empezar el descarte.</li>
</ul></div>
<div class="card"><h2>Tu turno</h2>
<p>Elige una de estas tres opciones:</p>
<ol>
<li><b>Robar del mazo.</b> Mira la carta y: cámbiala por una de las tuyas, descártala, o (si es del 7 a la Q) descártala para usar su poder.</li>
<li><b>Tomar la carta de arriba del descarte.</b> Debes cambiarla por una de tus cartas.</li>
<li><b>Decir «Cabo».</b> No robas. Los demás juegan un último turno y se termina la ronda.</li>
</ol>
<p class="muted small">La carta que sale de tu fila va al descarte boca arriba.</p></div>
<div class="card"><h2>Cambiar varias cartas</h2>
<p>Si crees tener 2 o más cartas del <b>mismo valor</b>, puedes cambiarlas todas por la carta que tomaste. Muéstralas:</p>
<ul>
<li>Si son iguales, van al descarte y te quedas con menos cartas.</li>
<li>Si no, te quedas con todas <b>y además</b> con la carta que tomaste.</li>
</ul></div>
<div class="card"><h2>Fin de la ronda y puntos</h2>
<p>La ronda termina cuando alguien dice «Cabo» (y los demás juegan un turno más) o cuando se acaba el mazo. Todos voltean y suman sus cartas.</p>
<ul>
<li><b>Quien dijo Cabo:</b> si tiene la suma más baja (o empata), anota <b>0</b>. Si no, anota su suma <b>+ 10</b> de castigo.</li>
<li><b>Los demás:</b> anotan la suma de sus cartas.</li>
<li><b>Kamikaze:</b> si terminas con exactamente dos Q y las dos K negras, anotas 0 y todos los demás anotan 50.</li>
</ul></div>
<div class="card"><h2>Fin de la partida</h2>
<ul>
<li>La partida termina cuando alguien <b>supera 100 puntos</b> (o el límite que elijas). Gana quien tenga menos.</li>
<li><b>100 exactos:</b> si quedas exactamente en 100, tu puntaje baja a 50. Solo una vez por jugador. Este marcador lo hace solo.</li>
</ul></div>`,
    en: `
<div class="card"><h2>Powers</h2>
<p class="muted small">They only work if you draw the card from the deck and discard it right away.</p>
<table>
<tr><th>7 · 8</th><td><b>Peek:</b> look at one of your own cards.</td></tr>
<tr><th>9 · 10</th><td><b>Spy:</b> look at another player's card.</td></tr>
<tr><th>J · Q</th><td><b>Swap:</b> trade one of your cards with another player's, without looking.</td></tr>
</table>
<p class="muted small">Values: Joker = −1, red K = 0, Ace (A) = 1; 10, Jack (J), Q and black K = 10. The other cards have no power.</p></div>
<div class="card"><h2>Goal</h2>
<p>End each round with the <b>lowest total</b> on your cards. At the end, the player with the fewest points wins.</p></div>
<div class="card"><h2>Setup</h2>
<ul>
<li>Standard deck with the 2 Jokers (54 cards). Values: Joker = −1, red K = 0, Ace = 1, 2 to 9 their number; 10, J, Q and black K are worth 10.</li>
<li>Each player gets <b>4 face-down cards</b> in a row and peeks at <b>2</b> of them once.</li>
<li>The rest is the draw pile. Flip one card to start the discard pile.</li>
</ul></div>
<div class="card"><h2>Your turn</h2>
<p>Choose one of three options:</p>
<ol>
<li><b>Draw from the deck.</b> Look at the card and: swap it for one of yours, discard it, or (if it's 7 to Q) discard it to use its power.</li>
<li><b>Take the top discard.</b> You must swap it for one of your cards.</li>
<li><b>Call "Cabo".</b> You don't draw. Everyone else takes one last turn and the round ends.</li>
</ol>
<p class="muted small">The card leaving your row goes face up on the discard pile.</p></div>
<div class="card"><h2>Swapping several cards</h2>
<p>If you think you have 2 or more cards of the <b>same value</b>, you may swap them all for the card you took. Reveal them:</p>
<ul>
<li>If they match, they go to the discard pile and you keep fewer cards.</li>
<li>If not, you keep them all <b>and also</b> the card you took.</li>
</ul></div>
<div class="card"><h2>End of round and scoring</h2>
<p>The round ends when someone calls "Cabo" (and the others take one more turn) or when the deck runs out. Everyone reveals and adds up their cards.</p>
<ul>
<li><b>The Cabo caller:</b> with the lowest total (or tied), scores <b>0</b>. Otherwise, scores their total <b>+ 10</b> penalty.</li>
<li><b>Everyone else:</b> scores the total of their cards.</li>
<li><b>Kamikaze:</b> if you end with exactly two Qs and both black Ks, you score 0 and everyone else scores 50.</li>
</ul></div>
<div class="card"><h2>End of game</h2>
<ul>
<li>The game ends when someone <b>goes over 100 points</b> (or the limit you choose). The lowest score wins.</li>
<li><b>Exactly 100:</b> if you land exactly on 100, your score drops to 50. Only once per player. This scorekeeper does it for you.</li>
</ul></div>`,
  };

  /* ---------- state (saved on every change) ---------- */

  const fresh = () => ({
    v: 1,
    lang: /^es/i.test(navigator.language || 'es') ? 'es' : 'en',
    tab: 'score',
    started: false,
    n: 4, rounds: 0, points: 100,
    names: Array(MAXP).fill(''),
    history: [],                 // one array of points per finished round
    draft: Array(MAXP).fill(''), // what is typed for the current round
  });

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && d.v === 1) return { ...fresh(), ...d };
    } catch { /* fall through */ }
    return fresh();
  }
  const s = load();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch { /* storage off */ } };

  const t = (k, ...a) => { const v = TXT[s.lang][k]; return typeof v === 'function' ? v(...a) : v; };
  const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nameOf = (i) => (s.names[i] || '').trim() || `${t('player')} ${i + 1}`;
  const $ = (q) => document.querySelector(q);

  /**
   * Replays every round. Landing exactly on the limit halves the score,
   * once per player. The game is over when someone goes over the limit or
   * the chosen number of rounds has been played.
   */
  function calc() {
    const tot = Array(s.n).fill(0);
    const used = Array(s.n).fill(false);
    const half = Math.floor(s.points / 2);
    const rows = s.history.map((r) => r.slice(0, s.n).map((p, i) => {
      tot[i] += p;
      let halved = false;
      if (tot[i] === s.points && !used[i]) { tot[i] = half; used[i] = halved = true; }
      return { p, halved };
    }));
    const over = (s.rounds > 0 && s.history.length >= s.rounds) || tot.some((x) => x > s.points);
    return { tot, used, rows, over, half, min: Math.min(...tot) };
  }

  /* ---------- views ---------- */

  function stepper(key, label, sub, shown) {
    return `<div class="opt"><div><b>${label}</b>${sub ? `<span class="muted small">${sub}</span>` : ''}</div>
      <div class="stepper"><button type="button" data-step="${key}" data-d="-1" aria-label="− ${label}">−</button>
      <output>${shown}</output>
      <button type="button" data-step="${key}" data-d="1" aria-label="+ ${label}">+</button></div></div>`;
  }

  function viewSetup() {
    const names = Array.from({ length: s.n }, (_, i) =>
      `<input type="text" maxlength="14" autocomplete="off" data-name="${i}" value="${esc(s.names[i] || '')}" placeholder="${t('player')} ${i + 1}" aria-label="${t('player')} ${i + 1}">`).join('');
    return `<div class="card"><h2>${t('newGame')}</h2>
      ${stepper('n', t('players'), '', s.n)}
      ${stepper('rounds', t('rounds'), t('roundsSub'), s.rounds || t('noLimit'))}
      ${stepper('points', t('points'), t('pointsSub'), s.points)}
      <p class="muted small" style="margin:8px 0 0">${t('halfInfo', s.points, Math.floor(s.points / 2))}</p></div>
      <div class="card"><h2>${t('names')}</h2><div class="names">${names}</div></div>
      <button class="btn" id="start">${t('start')}</button>`;
  }

  function viewGame() {
    const c = calc();
    const played = s.history.length;
    const roundNo = c.over ? played : played + 1;
    const last = c.rows[played - 1] || [];
    const notes = last.map((x, i) => (x.halved ? `<div class="note">${esc(t('halved', nameOf(i), s.points, c.half))}</div>` : '')).join('');

    let win = '';
    if (c.over) {
      const w = c.tot.map((x, i) => (x === c.min ? nameOf(i) : null)).filter(Boolean);
      win = `<div class="win">${t('over')}<b>${w.length > 1 ? t('winners') : t('winner')}: ${esc(w.join(' · '))}</b>${t('withPts', c.min)}</div>`;
    }

    const players = c.tot.map((tot, i) => {
      const lead = played > 0 && tot === c.min ? `<span class="tag lead">${c.over ? '★' : t('lead')}</span>` : '';
      const half = c.used[i] ? `<span class="tag half">${t('halfTag')}</span>` : '';
      const input = c.over ? '<span></span>' :
        `<div class="entry"><button type="button" class="neg" data-neg="${i}" aria-label="${esc(nameOf(i))}: ${t('sign')}">±</button>` +
        `<input class="pts" type="text" inputmode="numeric" pattern="-?[0-9]*" maxlength="4" autocomplete="off" placeholder="0" data-pts="${i}" value="${esc(s.draft[i] ?? '')}" aria-label="${esc(nameOf(i))}: ${t('points')}"></div>`;
      return `<div class="player"><div class="pname">${esc(nameOf(i))}${lead}${half}</div>
        <div class="total${tot > s.points ? ' out' : ''}">${tot}</div>${input}</div>`;
    }).join('');

    let hist = '';
    if (played) {
      const head = c.tot.map((_, i) => `<th>${esc(nameOf(i))}</th>`).join('');
      const body = c.rows.map((r, k) => `<tr><td>${k + 1}</td>${r.map((x) => `<td>${x.p}${x.halved ? ' <small>½</small>' : ''}</td>`).join('')}</tr>`).join('');
      hist = `<div class="card"><h2>${t('history')}</h2><div class="scroll"><table>
        <thead><tr><th>#</th>${head}</tr></thead><tbody>${body}</tbody>
        <tfoot><tr><td>${t('total')}</td>${c.tot.map((x) => `<td>${x}</td>`).join('')}</tr></tfoot></table></div></div>`;
    }

    return `<div class="status"><span>${t('round')} ${roundNo}${s.rounds ? ` ${t('of')} ${s.rounds}` : ''}</span><span>${t('limit')} ${s.points}</span></div>
      ${win}${notes}
      <div class="card">${players}
        ${c.over ? '' : `<p class="hint" id="hint" hidden>${t('fill')}</p><button class="btn" id="add" style="margin-top:12px">${t('addRound')}</button>`}
      </div>
      ${hist}
      <div class="row2"><button class="btn ghost" id="undo"${played ? '' : ' disabled style="opacity:.45"'}>${t('undo')}</button>
      <button class="btn danger" id="new">${t('newGame')}</button></div>`;
  }

  function render() {
    document.documentElement.lang = s.lang;
    document.title = t('title');
    $('#lang').textContent = t('other');
    for (const b of document.querySelectorAll('.tabs button')) {
      b.textContent = t(b.dataset.tab === 'score' ? 'tabScore' : 'tabRules');
      b.setAttribute('aria-selected', String(b.dataset.tab === s.tab));
    }
    $('#score').hidden = s.tab !== 'score';
    $('#rules').hidden = s.tab !== 'rules';
    $('#score').innerHTML = s.started ? viewGame() : viewSetup();
    $('#rules').innerHTML = RULES[s.lang];
  }

  /* ---------- actions ---------- */

  const LIMITS = { n: [2, MAXP, 1], rounds: [0, 50, 1], points: [10, 500, 5] };

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.tab) {
      // Only the visible panel changes; the score and anything typed stay put.
      s.tab = b.dataset.tab; save(); render(); window.scrollTo(0, 0);
    } else if (b.id === 'lang') {
      s.lang = s.lang === 'es' ? 'en' : 'es'; save(); render();
    } else if (b.dataset.step) {
      const [min, max, step] = LIMITS[b.dataset.step];
      s[b.dataset.step] = Math.min(max, Math.max(min, s[b.dataset.step] + step * Number(b.dataset.d)));
      save(); render();
    } else if (b.dataset.neg != null) {
      // Joker = -1 can make a round negative; the digit pad has no minus key.
      const i = Number(b.dataset.neg);
      const box = document.querySelector(`[data-pts="${i}"]`);
      const cur = String(s.draft[i] ?? '');
      s.draft[i] = box.value = cur.startsWith('-') ? cur.slice(1) : `-${cur}`;
      save(); box.focus();
    } else if (b.id === 'start') {
      s.started = true; s.history = []; s.draft = Array(MAXP).fill(''); save(); render(); window.scrollTo(0, 0);
    } else if (b.id === 'add') {
      const vals = s.draft.slice(0, s.n).map((v) => String(v ?? '').trim());
      if (vals.every((v) => v === '' || v === '-')) { $('#hint').hidden = false; return; }
      s.history.push(vals.map((v) => Math.min(999, Math.max(-99, Math.round(Number(v)) || 0))));
      s.draft = Array(MAXP).fill('');
      save(); render(); window.scrollTo(0, 0);
    } else if (b.id === 'undo') {
      const lastRound = s.history.pop();
      if (lastRound) { s.draft = Array.from({ length: MAXP }, (_, i) => (lastRound[i] != null ? String(lastRound[i]) : '')); save(); render(); }
    } else if (b.id === 'new') {
      if (s.history.length && !confirm(t('confirmNew'))) return;
      s.started = false; s.history = []; s.draft = Array(MAXP).fill(''); save(); render(); window.scrollTo(0, 0);
    }
  });

  // Typing is saved straight away (no re-render, so the keyboard stays open).
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.pts != null) {
      el.value = el.value.replace(/[^\d-]/g, '').replace(/(?!^)-/g, ''); // digits, optional leading minus
      s.draft[Number(el.dataset.pts)] = el.value;
    }
    else if (el.dataset.name != null) s.names[Number(el.dataset.name)] = el.value;
    else return;
    save();
  });

  // Enter moves to the next player's box, or adds the round from the last one.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.target.dataset.pts == null) return;
    e.preventDefault();
    const next = document.querySelector(`[data-pts="${Number(e.target.dataset.pts) + 1}"]`);
    if (next) next.focus(); else { e.target.blur(); $('#add').click(); }
  });

  render();

  // Offline copy when served over http(s); opening the file directly also works.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
