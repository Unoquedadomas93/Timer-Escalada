<html lang="es">

<title>Cabo sucio · Marcador</title>
<meta name="description" content="Marcador sencillo para el juego de cartas Cabo. Funciona sin conexión.">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    /* Independiente Santa Fe: red, white and gold */
    --bg: #ffffff; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #ead9b0;
    --accent: #c8102e; --accent-soft: #fbe3e7; --gold: #c9a227; --gold-soft: #f8efd2;
    --warn: #8a6a00; --warn-soft: #f8efd2; --danger: #c8102e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; color-scheme: light;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header {
    position: sticky; top: 0; z-index: 5; background: var(--accent); color: #fff;
    padding: max(10px, env(safe-area-inset-top)) 14px 10px; border-bottom: 4px solid var(--gold);
  }
  header .langs button { color: #fff; border-color: rgba(255,255,255,.5); }
  header .langs button[aria-pressed="true"] { background: #fff; color: var(--accent); border-color: var(--gold); }
  header .tabs { background: rgba(0,0,0,.18); }
  header .tabs button { color: rgba(255,255,255,.85); }
  header .tabs button[aria-selected="true"] { color: var(--accent); }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: .02em; }
  .langs { display: flex; gap: 4px; }
  .langs button { border: 1px solid var(--line); background: transparent; border-radius: 999px; min-width: 44px; min-height: 36px; padding: 0 10px; font-weight: 700; color: var(--muted); }
  .langs button[aria-pressed="true"] { background: var(--card); color: var(--text); border-color: var(--text); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--gold-soft); border-radius: 12px; padding: 4px; }
  .tabs button { border: 0; background: transparent; border-radius: 9px; min-height: 42px; font-weight: 700; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  main { max-width: 560px; margin: 0 auto; padding: 14px 14px calc(28px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  h2 { margin: 0 0 10px; font-size: 1.1rem; }
  .muted { color: var(--muted); }
  .small { font-size: .88rem; }

  .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt b { display: block; }
  .stepper { display: flex; align-items: center; gap: 8px; flex: none; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 1.4rem; font-weight: 700; line-height: 1; }
  .stepper output { min-width: 4.6em; text-align: center; font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .names { display: grid; gap: 8px; }
  .names input, .pts {
    width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px;
  }
  .btn { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 1.05rem; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid currentColor; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .status { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; margin: 2px 2px 10px; }
  .note { background: var(--warn-soft); color: #7a3d05; border-radius: 10px; padding: 9px 12px; margin-bottom: 12px; font-weight: 600; }
  .win { background: var(--accent); color: #fff; border: 3px solid var(--gold); border-radius: 14px; padding: 14px; margin-bottom: 14px; text-align: center; }
  .win b { display: block; font-size: 1.35rem; }
  .player { display: grid; grid-template-columns: minmax(0,1fr) auto 96px; align-items: center; gap: 10px; padding: 8px 0; }
  .pick { width: 96px; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 1.25rem; font-weight: 800; text-align: center; text-align-last: center; padding: 0 8px; font-variant-numeric: tabular-nums; }
  .podium { list-style: none; margin: 0; padding: 0; }
  .podium li { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 7px 0; }
  .podium li + li { border-top: 1px solid var(--line); }
  .rank { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .95rem; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
  .rank.r1 { background: var(--gold); border-color: var(--gold); color: #fff; }
  .rank.r2 { background: #a8adb4; border-color: #a8adb4; color: #fff; }
  .rank.r3 { background: #b57a45; border-color: #b57a45; color: #fff; }
  .podium .pts2 { font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .podium .out { color: var(--danger); }
  .scroll, .scroll * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .player + .player { border-top: 1px solid var(--line); }
  .pname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { display: inline-block; font-size: .72rem; font-weight: 700; border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: middle; }
  .tag.lead { background: var(--accent-soft); color: var(--accent); }
  .tag.half { background: var(--warn-soft); color: var(--warn); }
  .total { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; }
  .total.out { color: var(--danger); }
  .pts { text-align: center; font-size: 1.2rem; font-weight: 700; padding: 0 6px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--danger); font-weight: 600; margin: 8px 0 0; }

  .scroll { overflow-x: auto; }
  .scroll table { table-layout: fixed; }
  .scroll th, .scroll td { padding: 7px 4px; overflow: hidden; text-overflow: ellipsis; }
  .scroll th:first-child { width: 4.2em; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: .82rem; color: var(--muted); max-width: 6.5em; overflow: hidden; text-overflow: ellipsis; }
  th:first-child, td:first-child { text-align: left; color: var(--muted); }
  tfoot td { font-weight: 800; border-bottom: 0; }
  .hv { color: #1d6fd1; font-weight: 800; }

  .cards { display: flex; gap: 6px; }
  #rules th { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .pcard { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 40px; height: 56px; border: 2px solid #1d1d1f; border-radius: 7px; background: #fff; color: #1d1d1f; font-style: normal; font-weight: 800; font-size: 1.1rem; line-height: 1; box-shadow: 0 2px 4px rgba(0,0,0,.18); }
  .pcard b { font-size: 1.25rem; font-weight: 400; }
  .pcard.red { color: var(--accent); }
  #rules h2 { margin-top: 4px; }
  #rules ul, #rules ol { margin: 6px 0 10px; padding-left: 1.25em; }
  #rules li { margin: 4px 0; }
  #rules table td { text-align: left; white-space: normal; }
  #rules table th { text-align: left; white-space: normal; max-width: none; width: 104px; font-size: 1rem; color: var(--accent); }

  /* iPad / wide landscape screens: use the full width. Phones are unchanged. */
  @media (min-width: 900px) {
    body { font-size: 20px; }
    header { padding-left: 32px; padding-right: 32px; }
    .tabs { max-width: 520px; }
    main { max-width: none; padding: 22px 32px calc(40px + env(safe-area-inset-bottom)); }
    .card { padding: 22px; border-radius: 18px; }
    h2 { font-size: 1.5rem; }
    .status { font-size: 1.3rem; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .cols > .card, .colA > .card, .colB > .card { margin-bottom: 0; }
    .colA, .colB { display: grid; gap: 24px; align-content: start; }
    .btn { min-height: 62px; font-size: 1.2rem; }
    .stepper button { width: 54px; height: 54px; font-size: 1.7rem; }
    .stepper output { font-size: 1.35rem; min-width: 5.5em; }
    .names input { min-height: 56px; font-size: 1.1rem; }
    .player { grid-template-columns: minmax(0,1fr) auto 150px; padding: 12px 0; }
    .total { font-size: 2.1rem; }
    .pick { width: 150px; min-height: 60px; font-size: 1.5rem; }
    .podium li { padding: 11px 0; }
    .rank { width: 38px; height: 38px; font-size: 1.1rem; }
    .podium .pts2 { font-size: 1.6rem; }
    th, td { padding: 11px 10px; font-size: 1.15rem; }
    .win b { font-size: 1.7rem; }

    /* rules: two columns, big text, example cards for the powers */
    #rules { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; font-size: 1.3rem; line-height: 1.5; }
    #rules .card { margin: 0; }
    #rules h2 { font-size: 1.8rem; }
    #rules table th { font-size: 1.3rem; padding: 14px 10px 14px 0; vertical-align: middle; }
    #rules table td { font-size: 1.25rem; padding: 14px 0; }
    #rules th { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    #rules th .lab { font-weight: 800; }
    .cards { display: flex; gap: 8px; }
    .pcard { width: 54px; height: 76px; font-size: 1.5rem; border-radius: 8px; }
    .pcard b { font-size: 1.7rem; }
    #rules table th { width: auto; }
  }
</style>
</head>

  const RULES = {
    es: `
<div class="card"><h2>Poderes</h2>
<p class="muted small">Solo valen si robas la carta del mazo y la descartas enseguida.</p>
<table>
<tr><th><span class="lab">7 · 8</span><span class="cards"><i class="pcard">7<b>♣</b></i><i class="pcard red">8<b>♦</b></i></span></th><td><b>Me puedo masturbar:</b> mira una de tus cartas.</td></tr>
<tr><th><span class="lab">9 · 10</span><span class="cards"><i class="pcard">9<b>♠</b></i><i class="pcard red">10<b>♥</b></i></span></th><td><b>Masturbar a otro:</b> mira una carta de otro jugador.</td></tr>
<tr><th><span class="lab">J · Q</span><span class="cards"><i class="pcard red">J<b>♥</b></i><i class="pcard">Q<b>♠</b></i></span></th><td><b>Blind swap:</b> cambia una de tus cartas por la de otro jugador, sin mirarlas.</td></tr>
<tr><th><span class="lab">K negra (Juan Andrés)</span><span class="cards"><i class="pcard">K<b>♠</b></i><i class="pcard">K<b>♣</b></i></span></th><td><b>Masturbar + swap:</b> mira una carta de otro jugador y luego cambia una de tus cartas por la de otro jugador.</td></tr>
</table>
<p class="muted small">Valores: Joker = −1, K roja = 0, As (A) = 1; 10, Jota (J), Q y K negra = 10. Las demás cartas no tienen poder.</p></div>
<div class="card"><h2>Objetivo</h2>
<p>Terminar cada ronda con la <b>menor suma</b> de puntos en tus cartas. Al final gana quien tenga menos puntos.</p>
<p><b>Nueva regla:</b> para decir «Cabo» tus cartas deben sumar <b>5 puntos o menos</b>.</p></div>
<div class="card"><h2>Preparación</h2>
<ul>
<li>Baraja normal con los 2 Jokers (54 cartas). Valores: Joker = −1, K roja = 0, As = 1, del 2 al 9 su número; 10, J, Q y K negra valen 10.</li>

<li>El resto forma el mazo. Se voltea una carta para empezar el descarte.</li>
</ul></div>
<div class="card"><h2>Tu turno</h2>
<p>Elige una de estas tres opciones:</p>
<ol>
<li><b>Robar del mazo.</b> Mira la carta y: cámbiala por una de las tuyas, descártala, o (si es del 7 a la K negra) descártala para usar su poder.</li>
<li><b>Tomar la carta de arriba del descarte.</b> Debes cambiarla por una de tus cartas.</li>
<li><b>Decir «Cabo».</b> Solo si tus cartas suman <b>5 puntos o menos</b>. No robas. Los demás juegan un último turno y se termina la ronda.</li>
</ol>
<p class="muted small">La carta que sale de tu fila va al descarte boca arriba.</p>
<p><b>Una sola mano:</b> solo puedes usar una mano para tomar, mover y cambiar cartas.</p></div>
<div class="card"><h2>Cambiar varias cartas</h2>
<p>Si crees tener 2 o más cartas del <b>mismo valor</b>, puedes descartar <b>solo una</b> de ellas y poner la carta que tomaste en su lugar. Muéstrala para comprobar:</p>
<ul>
<li>Si la carta que descartas coincide con las demás del mismo valor, puedes descartar una más en la misma jugada.</li>
<li>Si no coincide, te quedas con todas <b>y además</b> con la carta que tomaste.</li>
</ul></div>
<div class="card"><h2>Fin de la ronda y puntos</h2>
<p>La ronda termina cuando alguien dice «Cabo» (y los demás juegan un turno más) o cuando se acaba el mazo. Todos voltean y suman sus cartas.</p>
<ul>
<li><b>Quien dijo Cabo:</b> si tiene la suma más baja (o empata), anota <b>0</b>. Si no, anota su suma <b>+ 10</b> de castigo.</li>
<li><b>Los demás:</b> anotan la suma de sus cartas.</li>
</ul></div>
<div class="card"><h2>Fin de la partida</h2>
<ul>
<li>La partida termina cuando alguien <b>supera 100 puntos</b> (o el límite que elijas). Gana quien tenga menos.</li>
<li><b>Mitad del límite:</b> si quedas exactamente en la mitad del límite (100 → 50), tu puntaje baja a la mitad (25). Si el límite es impar, la mitad se redondea hacia arriba. Solo una vez por jugador. Este marcador lo hace solo.</li>
</ul></div>`,

<div class="card"><h2>Powers</h2>
<p class="muted small">They only work if you draw the card from the deck and discard it right away.</p>
<table>

<tr><th><span class="lab">Black K</span><span class="cards"><i class="pcard">K<b>♠</b></i><i class="pcard">K<b>♣</b></i></span></th><td><b>Spy + Swap:</b> look at another player's card, then trade one of your cards with another player's.</td></tr>
</table>
<p class="muted small">Values: Joker = −1, red K = 0, Ace (A) = 1; 10, Jack (J), Q and black K = 10. The other cards have no power.</p></div>
<div class="card"><h2>Goal</h2>
<p>End each round with the <b>lowest total</b> on your cards. At the end, the player with the fewest points wins.</p>
<p><b>New rule:</b> to call "Cabo" your cards must total <b>5 points or less</b>.</p></div>
<div class="card"><h2>Setup</h2>
<ul>

<ol>

<p class="muted small">The card leaving your row goes face up on the discard pile.</p>
<p><b>One hand only:</b> you may use only one hand to take, move and swap cards.</p></div>
<div class="card"><h2>Swapping several cards</h2>
<p>If you think you have 2 or more cards of the <b>same value</b>, you may discard <b>only one</b> of them and put the card you took in its place. Reveal it to check:</p>
<ul>
<li>If the card you discard matches the others of that value, you may discard one more in the same move.</li>
<li>If it doesn't match, you keep them all <b>and also</b> the card you took.</li>
</ul></div>
<div class="card"><h2>End of round and scoring</h2>
<p>The round ends when someone calls "Cabo" (and the others take one more turn) or when the deck runs out. Everyone reveals and adds up their cards.</p>
<ul>
<li><b>The Cabo caller:</b> with the lowest total (or tied), scores <b>0</b>. Otherwise, scores their total <b>+ 10</b> penalty.</li>
<li><b>Everyone else:</b> scores the total of their cards.</li>
</ul></div>
<div class="card"><h2>End of game</h2>
<ul>
<li>The game ends when someone <b>goes over 100 points</b> (or the limit you choose). The lowest score wins.</li>
<li><b>Half the limit:</b> if you land exactly on half the limit (100 → 50), your score is halved (25). For an odd limit, half is rounded up. Only once per player. This scorekeeper does it for you.</li>
</ul></div>`,
    de: `
<div class="card"><h2>Fähigkeiten</h2>
<p class="muted small">Sie gelten nur, wenn du die Karte vom Stapel ziehst und sofort abwirfst.</p>
<table>
<tr><th><span class="lab">7 · 8</span><span class="cards"><i class="pcard">7<b>♣</b></i><i class="pcard red">8<b>♦</b></i></span></th><td><b>Peek:</b> Sieh dir eine deiner Karten an.</td></tr>
<tr><th><span class="lab">9 · 10</span><span class="cards"><i class="pcard">9<b>♠</b></i><i class="pcard red">10<b>♥</b></i></span></th><td><b>Spy:</b> Sieh dir eine Karte eines Mitspielers an.</td></tr>
<tr><th><span class="lab">J · Q</span><span class="cards"><i class="pcard red">J<b>♥</b></i><i class="pcard">Q<b>♠</b></i></span></th><td><b>Swap:</b> Tausche eine deiner Karten mit der eines Mitspielers, ohne sie anzusehen.</td></tr>
<tr><th><span class="lab">Schwarzer K</span><span class="cards"><i class="pcard">K<b>♠</b></i><i class="pcard">K<b>♣</b></i></span></th><td><b>Spy + Swap:</b> Sieh dir eine Karte eines Mitspielers an und tausche dann eine deiner Karten mit der eines Mitspielers.</td></tr>
</table>
<p class="muted small">Werte: Joker = −1, roter König = 0, Ass (A) = 1; 10, Bube (J), Dame (Q) und schwarzer König = 10. Die übrigen Karten haben keine Fähigkeit.</p></div>
<div class="card"><h2>Ziel</h2>
<p>Beende jede Runde mit der <b>niedrigsten Summe</b> auf deinen Karten. Am Ende gewinnt, wer die wenigsten Punkte hat.</p>
<p><b>Neue Regel:</b> Um «Cabo» anzusagen, müssen deine Karten <b>5 Punkte oder weniger</b> ergeben.</p></div>
<div class="card"><h2>Vorbereitung</h2>
<ul>
<li>Normales Kartenspiel mit den 2 Jokern (54 Karten). Werte: Joker = −1, roter König = 0, Ass = 1, 2 bis 9 ihr Zahlenwert; 10, Bube, Dame und schwarzer König zählen 10.</li>
<li>Jeder Spieler erhält <b>4 verdeckte Karten</b> in einer Reihe und sieht sich einmal <b>2</b> davon an.</li>
<li>Der Rest ist der Nachziehstapel. Eine Karte wird aufgedeckt und beginnt den Ablagestapel.</li>
</ul></div>
<div class="card"><h2>Dein Zug</h2>
<p>Wähle eine von drei Möglichkeiten:</p>
<ol>
<li><b>Vom Stapel ziehen.</b> Sieh dir die Karte an und: tausche sie gegen eine deiner Karten, wirf sie ab oder (bei 7 bis schwarzer König) wirf sie ab, um ihre Fähigkeit zu nutzen.</li>
<li><b>Die oberste Karte vom Ablagestapel nehmen.</b> Du musst sie gegen eine deiner Karten tauschen.</li>
<li><b>«Cabo» ansagen.</b> Nur wenn deine Karten <b>5 Punkte oder weniger</b> ergeben. Du ziehst nicht. Alle anderen haben noch einen Zug, dann endet die Runde.</li>
</ol>
<p class="muted small">Die Karte, die deine Reihe verlässt, kommt offen auf den Ablagestapel.</p>
<p><b>Nur eine Hand:</b> du darfst nur mit einer Hand Karten nehmen, bewegen und tauschen.</p></div>
<div class="card"><h2>Mehrere Karten tauschen</h2>
<p>Wenn du glaubst, 2 oder mehr Karten mit dem <b>gleichen Wert</b> zu haben, darfst du <b>nur eine</b> davon ablegen und die genommene Karte an ihre Stelle legen. Decke sie auf:</p>
<ul>
<li>Passt die abgelegte Karte zu den anderen mit diesem Wert, darfst du in demselben Zug eine weitere ablegen.</li>
<li>Wenn nicht, behältst du alle <b>und zusätzlich</b> die genommene Karte.</li>
</ul></div>
<div class="card"><h2>Rundenende und Wertung</h2>
<p>Die Runde endet, wenn jemand «Cabo» ansagt (und die anderen noch einen Zug hatten) oder wenn der Stapel leer ist. Alle decken auf und zählen ihre Karten zusammen.</p>
<ul>
<li><b>Wer Cabo angesagt hat:</b> bekommt mit der niedrigsten Summe (auch bei Gleichstand) <b>0</b> Punkte. Sonst die eigene Summe <b>+ 10</b> Strafpunkte.</li>
<li><b>Alle anderen:</b> bekommen die Summe ihrer Karten.</li>
</ul></div>
<div class="card"><h2>Spielende</h2>
<ul>
<li>Das Spiel endet, sobald jemand <b>mehr als 100 Punkte</b> hat (oder das gewählte Limit). Es gewinnt, wer die wenigsten Punkte hat.</li>
<li><b>Halbes Limit:</b> Wer genau die Hälfte des Limits erreicht (100 → 50), wird halbiert (25). Bei ungeradem Limit wird die Hälfte aufgerundet. Nur einmal pro Spieler. Dieser Zähler macht das automatisch.</li>
</ul></div>`,
  };

  /* ---------- state (saved on every change) ---------- */

  const fresh = () => ({
    v: 1,
    lang: 'es', // solo español
    tab: 'score',
    started: false,
    n: 4, rounds: 0, points: 100,
    names: Array(MAXP).fill(''),
    history: [],                 // one array of points per finished round
    draft: Array(MAXP).fill('0'), // picker values for the current round
  });

  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && d.v === 1) return { ...fresh(), ...d };
    } catch { /* fall through */ }
    return fresh();
  }
  const s = load();
  s.lang = 'es';
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch { /* storage off */ } };

  const t = (k, ...a) => { const v = TXT[s.lang][k]; return typeof v === 'function' ? v(...a) : v; };
  const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nameOf = (i) => (s.names[i] || '').trim() || `${t('player')} ${i + 1}`;
  const $ = (q) => document.querySelector(q);

  /**
   * Replays every round. Landing exactly on the limit halves the score,
   * once per player. The game is over when someone goes over the limit or
   * the chosen number of rounds has been played.
   */
  function calc() {
    const tot = Array(s.n).fill(0);
    const used = Array(s.n).fill(false);
    const trig = Math.ceil(s.points / 2);
    const half = Math.ceil(trig / 2);
    const rows = s.history.map((r) => r.slice(0, s.n).map((p, i) => {
      tot[i] += p;
      let halved = false;
      if (tot[i] === trig && !used[i]) { tot[i] = half; used[i] = halved = true; }
      return { p, halved };
    }));
    const over = (s.rounds > 0 && s.history.length >= s.rounds) || tot.some((x) => x > s.points);
    return { tot, used, rows, over, trig, half, min: Math.min(...tot) };
  }

  /* ---------- views ---------- */

  function stepper(key, label, sub, shown) {
    return `<div class="opt"><div><b>${label}</b>${sub ? `<span class="muted small">${sub}</span>` : ''}</div>
      <div class="stepper"><button type="button" data-step="${key}" data-d="-1" aria-label="− ${label}">−</button>
      <output>${shown}</output>
      <button type="button" data-step="${key}" data-d="1" aria-label="+ ${label}">+</button></div></div>`;
  }

  function viewSetup() {
    const names = Array.from({ length: s.n }, (_, i) =>
      `<input type="text" maxlength="14" autocomplete="off" data-name="${i}" value="${esc(s.names[i] || '')}" placeholder="${t('player')} ${i + 1}" aria-label="${t('player')} ${i + 1}">`).join('');
    return `<div class="cols"><div class="card"><h2>${t('newGame')}</h2>
      ${stepper('n', t('players'), '', s.n)}
      ${stepper('rounds', t('rounds'), t('roundsSub'), s.rounds || t('noLimit'))}
      ${stepper('points', t('points'), t('pointsSub'), s.points)}
      <p class="muted small" style="margin:8px 0 0">${t('halfInfo', Math.ceil(s.points / 2), Math.ceil(Math.ceil(s.points / 2) / 2))}</p></div>
      <div class="card"><h2>${t('names')}</h2><div class="names">${names}</div></div></div>
      <button class="btn" id="start">${t('start')}</button>`;
  }

  function viewGame() {
    const c = calc();
    const played = s.history.length;
    const roundNo = c.over ? played : played + 1;
    const last = c.rows[played - 1] || [];
    const notes = last.map((x, i) => (x.halved ? `<div class="note">${esc(t('halved', nameOf(i), c.trig, c.half))}</div>` : '')).join('');

    let win = '';
    if (c.over) {
      const w = c.tot.map((x, i) => (x === c.min ? nameOf(i) : null)).filter(Boolean);
      win = `<div class="win">${t('over')}<b>${w.length > 1 ? t('winners') : t('winner')}: ${esc(w.join(' · '))}</b>${t('withPts', c.min)}</div>`;
    }

    const players = c.tot.map((tot, i) => {
      const lead = played > 0 && tot === c.min ? `<span class="tag lead">${c.over ? '★' : t('lead')}</span>` : '';
      const half = c.used[i] ? `<span class="tag half">${t('halfTag')}</span>` : '';
      const input = c.over ? '<span></span>' :
        `<select class="pick" data-pts="${i}" aria-label="${esc(nameOf(i))}: ${t('points')}">${PICK_VALUES.map((v) => `<option${String(v) === String(s.draft[i] ?? '0') ? ' selected' : ''}>${v}</option>`).join('')}</select>`;
      return `<div class="player"><div class="pname">${esc(nameOf(i))}${lead}${half}</div>
        <div class="total${tot > s.points ? ' out' : ''}">${tot}</div>${input}</div>`;
    }).join('');

    const order = c.tot.map((tot, i) => ({ tot, i })).sort((a, b) => a.tot - b.tot || a.i - b.i);
    const podium = `<div class="card"><h2>${t('podium')}</h2><ol class="podium">${order.map((o) => {
      const place = 1 + c.tot.filter((x) => x < o.tot).length;
      return `<li><span class="rank${place <= 3 ? ` r${place}` : ''}">${place}</span><span class="pname">${esc(nameOf(o.i))}</span><span class="pts2${o.tot > s.points ? ' out' : ''}">${o.tot}</span></li>`;
    }).join('')}</ol></div>`;

    let hist = '';
    if (played) {
      const head = c.tot.map((_, i) => `<th>${esc(nameOf(i))}</th>`).join('');
      const body = c.rows.map((r, k) => `<tr><td>${k + 1}</td>${r.map((x) => `<td>${x.halved ? `<span class="hv">${x.p} ½</span>` : x.p}</td>`).join('')}</tr>`).join('');
      hist = `<div class="card"><h2>${t('history')}</h2><div class="scroll"><table style="min-width:${4.2 + s.n * 3}em">
        <thead><tr><th>#</th>${head}</tr></thead><tbody>${body}</tbody>
        <tfoot><tr><td>${t('total')}</td>${c.tot.map((x) => `<td>${x}</td>`).join('')}</tr></tfoot></table></div></div>`;
    }

    return `<div class="status"><span>${t('round')} ${roundNo}${s.rounds ? ` ${t('of')} ${s.rounds}` : ''}</span><span>${t('limit')} ${s.points}</span></div>
      ${win}${notes}
      <div class="cols"><div class="colA">${podium}${hist}</div><div class="colB">
      <div class="card">${players}
        ${c.over ? '' : `<p class="hint" id="hint" hidden>${t('fill')}</p><button class="btn" id="add" style="margin-top:12px">${t('addRound')}</button>`}
      </div>
      <div class="row2"><button class="btn ghost" id="undo"${played ? '' : ' disabled style="opacity:.45"'}>${t('undo')}</button>
      <button class="btn danger" id="reset">${t('reset')}</button></div>
      <button class="btn ghost" id="new" style="margin-top:10px">${t('newGame')}</button></div></div>`;
  }

  function render() {
    document.documentElement.lang = s.lang;
    document.title = t('title');
    for (const b of document.querySelectorAll('.langs button')) b.setAttribute('aria-pressed', String(b.dataset.lang === s.lang));
    for (const b of document.querySelectorAll('.tabs button')) {
      b.textContent = t(b.dataset.tab === 'score' ? 'tabScore' : 'tabRules');
      b.setAttribute('aria-selected', String(b.dataset.tab === s.tab));
    }
    $('#score').hidden = s.tab !== 'score';
    $('#rules').hidden = s.tab !== 'rules';
    $('#score').innerHTML = s.started ? viewGame() : viewSetup();
    $('#rules').innerHTML = RULES[s.lang];
  }

  /* ---------- actions ---------- */

  const LIMITS = { n: [2, MAXP, 1], rounds: [0, 50, 1], points: [10, 500, 5] };
  const PICK_VALUES = Array.from({ length: 56 }, (_, k) => k - 5); // -5 .. 50

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.tab) {
      // Only the visible panel changes; the score and anything typed stay put.
      s.tab = b.dataset.tab; save(); render(); window.scrollTo(0, 0);
    } else if (b.dataset.lang) {
      s.lang = b.dataset.lang; save(); render();
    } else if (b.dataset.step) {
      const [min, max, step] = LIMITS[b.dataset.step];
      s[b.dataset.step] = Math.min(max, Math.max(min, s[b.dataset.step] + step * Number(b.dataset.d)));
      save(); render();
    } else if (b.id === 'start') {
      s.started = true; s.history = []; s.draft = Array(MAXP).fill('0'); save(); render(); window.scrollTo(0, 0);
    } else if (b.id === 'add') {
      const vals = s.draft.slice(0, s.n).map((v) => String(v ?? '').trim());
      s.history.push(vals.map((v) => Math.min(999, Math.max(-99, Math.round(Number(v)) || 0))));
      s.draft = Array(MAXP).fill('0');
      save(); render(); window.scrollTo(0, 0);
    } else if (b.id === 'undo') {
      const lastRound = s.history.pop();
      if (lastRound) { s.draft = Array.from({ length: MAXP }, (_, i) => (lastRound[i] != null ? String(lastRound[i]) : '0')); save(); render(); }
    } else if (b.id === 'reset') {
      if (s.history.length && !confirm(t('confirmReset'))) return;
      s.history = []; s.draft = Array(MAXP).fill('0'); save(); render(); window.scrollTo(0, 0);
    } else if (b.id === 'new') {
      if (s.history.length && !confirm(t('confirmNew'))) return;
      s.started = false; s.history = []; s.draft = Array(MAXP).fill('0'); save(); render(); window.scrollTo(0, 0);
    }
  });

  // Typing is saved straight away (no re-render, so the keyboard stays open).
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.pts != null) {
      s.draft[Number(el.dataset.pts)] = el.value;
    }
    else if (el.dataset.name != null) s.names[Number(el.dataset.name)] = el.value;
    else return;
    save();
  });

  // Enter moves to the next player's box, or adds the round from the last one.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.target.dataset.pts == null) return;
    e.preventDefault();
    const next = document.querySelector(`[data-pts="${Number(e.target.dataset.pts) + 1}"]`);
    if (next) next.focus(); else { e.target.blur(); $('#add').click(); }
  });

  render();

  // Offline copy when served over http(s); opening the file directly also works.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
