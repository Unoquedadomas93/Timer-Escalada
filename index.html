<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Timer Escalada</title>
  <meta name="description" content="Temporizador de intervalos, Tabata y cronómetro. Gratis, sin anuncios y funciona sin conexión.">
  <meta name="theme-color" content="#262626">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timer Escalada">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/bebas-neue.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <!-- TIMER -->
    <section id="tab-timer" class="screen timer">
      <header class="head">
        <button class="hbtn" id="t-edit" data-i18n-label="editWorkout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <div class="head-title">
          <div id="t-name" class="head-name"></div>
          <div id="t-total" class="head-sub" aria-label=""></div>
        </div>
        <button class="hbtn" id="t-pick" data-i18n-label="chooseWorkout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 12 8.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div id="t-current" class="panel panel-current phase-prepare">
        <button class="reset-btn" id="t-reset" data-i18n-label="reset">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4z"/></svg>
        </button>
        <div id="t-phase" class="panel-label" aria-live="polite"></div>
        <div id="t-time" class="panel-time" role="timer">00:00</div>
        <div id="t-msg" class="panel-msg" aria-live="assertive"></div>
        <div class="progress" aria-hidden="true"><div id="t-progress" class="progress-bar"></div></div>
      </div>

      <button id="t-next" class="panel panel-next phase-work" data-i18n-label="skip">
        <span id="t-next-phase" class="next-label"></span>
        <span id="t-next-time" class="next-time">00:00</span>
        <svg class="next-skip" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 18 8.5-6L5 6zm9.5-12v12h2.5V6z"/></svg>
      </button>

      <div class="controls">
        <div class="stat">
          <div id="t-rounds" class="stat-num blue">0</div>
          <div class="stat-label" data-i18n="roundsLeft"></div>
        </div>
        <div class="play-wrap">
          <button id="t-toggle" class="play-btn" data-i18n-label="start">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
          </button>
          <div id="t-toggle-label" class="play-label"></div>
        </div>
        <div class="stat">
          <div id="t-cycles" class="stat-num yellow">0</div>
          <div class="stat-label" data-i18n="cyclesLeft"></div>
        </div>
      </div>
    </section>

    <!-- WORKOUTS -->
    <section id="tab-workouts" class="screen page" hidden>
      <header class="head head-plain"><h1 class="head-name" data-i18n="tabWorkouts"></h1></header>
      <div class="page-body">
        <ul id="preset-list" class="preset-list"></ul>
        <button id="btn-new" class="btn-yellow" data-i18n="newWorkoutShort"></button>
      </div>
    </section>

    <!-- STOPWATCH -->
    <section id="tab-stopwatch" class="screen timer" hidden>
      <header class="head head-plain"><h1 class="head-name" data-i18n="tabStopwatch"></h1></header>
      <div class="panel panel-current phase-prepare sw-panel">
        <div id="sw-time" class="panel-time sw-time" role="timer">00:00.0</div>
      </div>
      <ol id="sw-laps" class="laps"></ol>
      <div class="controls">
        <div class="play-wrap">
          <button id="sw-reset" class="round-btn" data-i18n-label="reset">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4z"/></svg>
          </button>
          <div class="play-label small" data-i18n="reset"></div>
        </div>
        <div class="play-wrap">
          <button id="sw-toggle" class="play-btn" data-i18n-label="start">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
          </button>
          <div id="sw-toggle-label" class="play-label"></div>
        </div>
        <div class="play-wrap">
          <button id="sw-lap" class="round-btn" data-i18n-label="lap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.4 6 14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg>
          </button>
          <div class="play-label small" data-i18n="lap"></div>
        </div>
      </div>
    </section>

    <!-- MORE -->
    <section id="tab-more" class="screen page" hidden>
      <header class="head head-plain"><h1 class="head-name" data-i18n="tabMore"></h1></header>
      <div class="page-body">
        <form id="form-countdown" class="card">
          <h2 class="section-title" data-i18n="countdown"></h2>
          <div class="countdown-row">
            <input id="cd-min" type="number" inputmode="numeric" min="0" max="599" value="5" data-i18n-label="minutes">
            <span class="colon">:</span>
            <input id="cd-sec" type="number" inputmode="numeric" min="0" max="59" value="0" data-i18n-label="seconds">
            <button type="submit" class="btn-yellow btn-inline" data-i18n="start"></button>
          </div>
        </form>

        <div class="card">
          <h2 class="section-title" data-i18n="settings"></h2>
          <label class="row">
            <span data-i18n="language"></span>
            <select id="set-lang">
              <option value="es">Español</option>
              <option value="en">English</option>
            </select>
          </label>
          <label class="row"><span data-i18n="sound"></span><input type="checkbox" id="set-sound" class="toggle"></label>
          <button type="button" id="btn-test-sound" class="btn-outline" data-i18n="testSound"></button>
          <p class="hint" data-i18n="soundHint"></p>
          <label class="row"><span data-i18n="vibrate"></span><input type="checkbox" id="set-vibrate" class="toggle"></label>
          <label class="row"><span data-i18n="voice"></span><input type="checkbox" id="set-voice" class="toggle"></label>
          <label class="row">
            <span><span data-i18n="flash"></span><small class="hint block" data-i18n="flashHint"></small></span>
            <input type="checkbox" id="set-flash" class="toggle">
          </label>
        </div>

        <div class="card">
          <h2 class="section-title" data-i18n="history"></h2>
          <ul id="history-list" class="history-list"></ul>
          <p id="history-empty" class="hint" data-i18n="noHistory" hidden></p>
          <button id="btn-clear-history" class="btn-outline danger" data-i18n="clearHistory"></button>
        </div>

        <p class="hint center" data-i18n="privacy"></p>
        <p class="hint center" id="app-version"></p>
      </div>
    </section>

    <!-- EDITOR (full screen, opened from the gear or a workout) -->
    <section id="view-editor" class="screen page editor-screen" hidden>
      <header class="head">
        <button class="hbtn" id="ed-back" data-i18n-label="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
        </button>
        <div class="head-title"><h1 id="editor-title" class="head-name"></h1></div>
        <span class="hbtn-spacer"></span>
      </header>
      <form id="form-editor" class="page-body editor" novalidate>
        <label class="field">
          <span class="field-label" data-i18n="name"></span>
          <input id="ed-name" type="text" maxlength="60" autocomplete="off">
        </label>
        <div id="ed-fields" class="editor-grid"></div>
        <p class="total-line"><span data-i18n="totalTime"></span> <strong id="ed-total">00:00</strong></p>
        <p id="ed-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn-yellow" data-i18n="save"></button>
        <button type="button" id="ed-delete" class="btn-outline danger" data-i18n="delete"></button>
      </form>
    </section>

    <!-- TAB BAR -->
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="timer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5" fill="currentColor"/><path d="M10 3h4M12 3v3M18 6l1.5-1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 13.5V9" stroke="var(--tab-bg)" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span data-i18n="tabTimer"></span>
      </button>
      <button class="tab" data-tab="workouts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 12 8.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span data-i18n="tabWorkouts"></span>
      </button>
      <button class="tab" data-tab="stopwatch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
        <span data-i18n="tabStopwatch"></span>
      </button>
      <button class="tab" data-tab="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 1-6 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span data-i18n="tabMore"></span>
      </button>
    </nav>
  </div>

  <div id="flash" class="flash" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
