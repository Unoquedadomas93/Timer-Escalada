<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Timer Escalada</title>
  <meta name="description" content="Temporizador de intervalos, Tabata, rondas y cronómetro. Gratis, sin anuncios y funciona sin conexión.">
  <meta name="theme-color" content="#262626">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timer Escalada">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/bebas-neue.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- One timer screen; cloned into the TABATA, RONDAS and CRONÓMETRO tabs. -->
  <template id="tpl-timer">
    <header class="head">
      <button class="hbtn js-setup" data-i18n-label="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <div class="head-title">
        <div class="head-name js-name"></div>
        <div class="head-sub js-total"></div>
      </div>
      <button class="hbtn js-list" data-i18n-label="myWorkouts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 12 8.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="panel panel-current js-current">
      <button class="reset-btn js-reset" data-i18n-label="reset">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4z"/></svg>
      </button>
      <div class="panel-label js-phase" aria-live="polite"></div>
      <div class="panel-time js-time" role="timer">00:00</div>
      <div class="panel-msg js-msg" aria-live="assertive"></div>
      <div class="progress" aria-hidden="true"><div class="progress-bar js-progress"></div></div>
    </div>
    <button class="panel panel-next js-next" data-i18n-label="skip">
      <span class="next-label js-next-phase"></span>
      <span class="next-time js-next-time">00:00</span>
      <svg class="next-skip" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 18 8.5-6L5 6zm9.5-12v12h2.5V6z"/></svg>
    </button>
    <div class="controls">
      <div class="stat js-stat-left">
        <div class="stat-num blue js-left">0</div>
        <div class="stat-label js-left-label"></div>
      </div>
      <div class="play-wrap">
        <button class="play-btn js-toggle" data-i18n-label="start">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
        </button>
        <div class="play-label js-toggle-label"></div>
      </div>
      <div class="stat js-stat-right">
        <div class="stat-num yellow js-right">0</div>
        <div class="stat-label js-right-label"></div>
      </div>
    </div>
  </template>

  <section id="tab-tabata" class="screen timer accent-yellow"></section>
  <section id="tab-rounds" class="screen timer accent-blue" hidden></section>
  <section id="tab-stopwatch" class="screen timer accent-green" hidden></section>

  <section id="tab-more" class="screen list-screen" hidden>
    <header class="head head-plain"><h1 class="head-name accent-text" data-i18n="tabMore"></h1></header>
    <div class="list-body" id="more-body"></div>
  </section>

  <!-- Setup menu (CANCELAR · title · GUARDAR) -->
  <section id="setup" class="screen list-screen sheet" hidden>
    <header class="sheet-head">
      <button class="sheet-link grey js-cancel" data-i18n="cancel"></button>
      <button class="sheet-title js-title"></button>
      <button class="sheet-link green js-save" data-i18n="save"></button>
    </header>
    <div class="list-body">
      <div class="section-bar" data-i18n="intervals"></div>
      <ul class="rows js-rows"></ul>
      <button class="add-btn danger js-delete" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>
        <span data-i18n="deleteWorkout"></span>
      </button>
    </div>
  </section>

  <!-- Saved workouts (opened from the TABATA timer icon) -->
  <section id="workouts" class="screen list-screen sheet" hidden>
    <header class="sheet-head">
      <button class="sheet-link grey js-close" data-i18n="close"></button>
      <div class="sheet-title static" data-i18n="myWorkouts"></div>
      <span class="sheet-link"></span>
    </header>
    <div class="list-body">
      <div class="section-bar" data-i18n="tabTabata"></div>
      <ul class="rows js-rows"></ul>
      <button class="add-btn js-add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="8" fill="currentColor"/><path d="M10 3h4M12 3v2.5M18.5 6l1.3-1.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 13.5V9.5" stroke="#4a4a4a" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span data-i18n="addWorkout"></span>
      </button>
    </div>
  </section>

  <!-- Value picker (bottom sheet) -->
  <div id="picker" class="picker-backdrop" hidden>
    <div class="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <div class="picker-head">
        <span class="picker-dot js-dot"></span>
        <h2 id="picker-title" class="picker-title"></h2>
      </div>
      <div class="picker-cols js-cols"></div>
      <button class="picker-ok js-ok" data-i18n="ok"></button>
    </div>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="tabata">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fillable" cx="12" cy="13.5" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3h4M12 3v3M18 6l1.5-1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="hand" d="M12 13.5V9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span data-i18n="tabTabata"></span>
    </button>
    <button class="tab" data-tab="rounds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fillable" cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path class="hand" d="M12 12 8.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span data-i18n="tabRounds"></span>
    </button>
    <button class="tab" data-tab="stopwatch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fillable" cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle class="hand-dot" cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
      <span data-i18n="tabStopwatch"></span>
    </button>
    <button class="tab" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 1-6 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span data-i18n="tabMore"></span>
    </button>
  </nav>

  <div id="flash" class="flash" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
